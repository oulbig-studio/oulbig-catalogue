name: Diagnostic DNS e-mail (temporaire)
on: workflow_dispatch
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for d in almoqayada.com radio.almoqayada.com; do
            echo "== $d"; echo "MX:"; dig +short MX $d; echo "TXT:"; dig +short TXT $d
            echo "DMARC:"; dig +short TXT _dmarc.$d
            for s in hostingermail-a hostingermail-b hostingermail-c hostingermail1 hostingermail2 default; do r=$(dig +short TXT $s._domainkey.$d; dig +short CNAME $s._domainkey.$d); [ -n "$r" ] && echo "DKIM $s: ${r:0:90}"; done
          done
          echo "== SMTP"; timeout 10 bash -c 'echo QUIT | openssl s_client -connect smtp.hostinger.com:465 -quiet 2>&1 | head -2'
